events { worker_connections 1024; }

http {
    # Docker DNS — tìm các container "agent" khi scale
    resolver 127.0.0.11 valid=10s;

    upstream agent_cluster {
        zone agent_cluster 64k;   # bắt buộc khi dùng "resolve"
        # "resolve" (nginx ≥ 1.27.3): hỏi lại DNS mỗi 10s → tự thấy instance mới khi
        # scale hoặc khi container được tạo lại, không cần restart nginx.
        server agent:8000 resolve;
        keepalive 32;
    }

    server {
        listen 80;

        add_header X-Served-By $upstream_addr always;

        # 🔒 /metrics chỉ dành cho Prometheus (scrape trực tiếp trong mạng nội bộ).
        #    Không public ra ngoài: metric lộ thông tin hệ thống, route, lưu lượng...
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://agent_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_next_upstream error timeout;   # instance chết → thử instance khác
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;              # agent treo quá 10s → 504, đánh dấu instance lỗi
        }

        location /health {
            proxy_pass http://agent_cluster/health;
            access_log off;
        }
    }
}
